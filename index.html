<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHIFUMI</title>
    <meta name="description" content="Jouez au Shifumi en ligne gratuitement, défiez l'ordinateur et tentez de remporter la victoire !">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <h1 id="titre">Shifumi</h1>
    
    <div id="jeu">
      <button onclick="jouer('Pierre')">Pierre</button>
      <button onclick="jouer('Feuille')">Feuille</button>
      <button onclick="jouer('Ciseaux')">Ciseaux</button>
    </div>

    <div id="resultat">
      <p id="choix-ordi"></p>
      <p>
        <span id="label-victoires">Victoire</span> : <span id="compte-victoires">0</span> |
        <span id="label-egalites">Égalité</span> : <span id="compte-egalites">0</span> |
        <span id="label-defaites">Défaite</span> : <span id="compte-defaites">0</span>
      </p>
      <button onclick="reset()">Réinitialiser le score</button>
    </div>
  </body>
</html>
